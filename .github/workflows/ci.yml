name: Build, test, and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked dependencies
        run: dotnet restore BaiduPCS.NET.slnx --locked-mode
      - name: Build
        run: dotnet build BaiduPCS.NET.slnx --no-restore --configuration Release
      - name: Run offline tests
        run: dotnet test --solution BaiduPCS.NET.slnx --configuration Release --no-build --no-restore
      - name: Compare one-shot and shell commands
        shell: pwsh
        run: ./.github/scripts/test-cli.ps1

  standalone:
    name: Build and test executables (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, runner: windows-latest }
          - { rid: win-arm64, runner: windows-11-arm }
          - { rid: osx-x64, runner: macos-26-intel }
          - { rid: osx-arm64, runner: macos-latest }
          - { rid: linux-x64, runner: ubuntu-latest }
          - { rid: linux-arm64, runner: ubuntu-26.04-arm }
          - { rid: linux-musl-x64, runner: ubuntu-latest }
          - { rid: linux-musl-arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Build and smoke-test both executable variants
        shell: pwsh
        env:
          RUNTIME: ${{ matrix.rid }}
        run: |
          $options = @{ Runtime = $env:RUNTIME }
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $options.ReleaseVersion = $env:GITHUB_REF_NAME.Substring(1) }
          & ./.github/scripts/package-standalone.ps1 @options
          & ./.github/scripts/package-standalone.ps1 @options -FrameworkDependent
      - name: Verify installer selection and installation
        if: github.repository == 'ajtn123/BaiduPCS.NET'
        shell: pwsh
        env:
          RUNTIME: ${{ matrix.rid }}
        run: |
          $auto = Join-Path $env:RUNNER_TEMP 'baidupcs-install-auto'
          $standalone = Join-Path $env:RUNNER_TEMP 'baidupcs-install-standalone'
          if ($env:RUNTIME.StartsWith('linux-musl-')) {
              $mount = "type=bind,source=$PWD,target=/repo,readonly"
              docker run --rm --user 0:0 --mount $mount mcr.microsoft.com/dotnet/runtime:10.0-alpine-extra sh -ec '
                apk add --no-cache curl jq
                result=$(sh /repo/install.sh --install-dir /tmp/auto)
                printf "%s\n" "$result"
                printf "%s\n" "$result" | grep -F "(framework-dependent, linux-musl-"
                sh /repo/install.sh --install-dir /tmp/standalone --self-contained
                test "$(/tmp/auto/baidupcs --version)" = "$(/tmp/standalone/baidupcs --version)"
              '
              exit $LASTEXITCODE
          }
          if ($IsWindows) {
              $detected = & ./install.ps1 -InstallDir $auto 6>&1
              & ./install.ps1 -InstallDir $standalone -SelfContained
              $extension = '.exe'
          } else {
              $detected = sh ./install.sh --install-dir $auto
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
              sh ./install.sh --install-dir $standalone --self-contained
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
              $extension = ''
          }
          $detected
          if (($detected -join ' ') -notmatch "(?i)\(framework-dependent, $env:RUNTIME\)") {
              throw "The installer did not select the expected framework-dependent asset for $env:RUNTIME."
          }
          $autoVersion = & (Join-Path $auto "baidupcs$extension") --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $standaloneVersion = & (Join-Path $standalone "baidupcs$extension") --version
          if ($LASTEXITCODE -ne 0 -or $autoVersion -ne $standaloneVersion) {
              throw 'Installed executable versions differ.'
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-${{ matrix.rid }}
          path: artifacts/standalone/
          if-no-files-found: error

  publish:
    name: Publish standalone executables
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'ajtn123/BaiduPCS.NET'
    needs: [build, standalone]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: standalone-*
          path: artifacts/release
          merge-multiple: true
      - name: Verify and publish release assets
        working-directory: artifacts/release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          binaries=()
          self_contained=()
          for rid in win-x64 win-arm64 osx-x64 osx-arm64 linux-x64 linux-arm64 linux-musl-x64 linux-musl-arm64; do
            base="BaiduPCS.NET-$GITHUB_REF_NAME-$rid"
            extension=""
            if [[ "$rid" == win-* ]]; then extension=".exe"; fi
            name="$base$extension"
            dependent="$base-framework-dependent$extension"
            test -s "$name"
            test -s "$dependent"
            test -s "$name.runtime-notices.txt"
            binaries+=("$name" "$dependent")
            self_contained+=("$name")
          done
          {
            for notice in ../../LICENSE ../../THIRD-PARTY-NOTICES.md ../../licenses/*.txt; do
              printf '\n=== %s ===\n\n' "${notice#../../}"
              cat "$notice"
            done
            for name in "${self_contained[@]}"; do
              printf '\n=== .NET runtime notices for %s ===\n\n' "$name"
              cat "$name.runtime-notices.txt"
            done
          } > LICENSES.txt
          cp ../../install.ps1 ../../install.sh .
          gh release create "$GITHUB_REF_NAME" "${binaries[@]}" LICENSES.txt install.ps1 install.sh \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --latest
          expected=$(sha256sum "${binaries[@]}" LICENSES.txt install.ps1 install.sh | sed 's/^/sha256:/' | sort)
          published=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            --jq '.assets[] | "\(.digest)  \(.name)"' | sort)
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$published")
